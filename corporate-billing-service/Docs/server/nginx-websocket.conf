# ==============================================================================
# WebSocket (STOMP) de corporate-billing-service detrás de Nginx
# ==============================================================================
# El WebSocket usa el MISMO servidor HTTP del backend (puerto de la app, ruta /ws):
# no hay que publicar un puerto adicional en Docker. Adaptar al server{} existente:
# solo se agrega este location junto al que ya enruta /api/ al backend.
#
# Los frontends se conectan a wss://<dominio-del-frontend>/ws, así que este bloque va en
# el server{} de cada dominio que sirve un frontend (panel y pasarela), apuntando al
# mismo upstream que /api/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dentro del server { ... } existente:
location /ws {
    proxy_pass http://corporate_billing_backend;   # mismo upstream que /api/

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    # El backend valida el origen contra CORS_ALLOWED_ORIGINS: no reescribir Origin.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Conexiones de larga duración; los heartbeats STOMP (10 s) las mantienen vivas.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
