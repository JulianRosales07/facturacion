<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Facturación Corporativa</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="assets/layout/images/corporativo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script>
    // Aplica el tema antes de pintar para evitar un destello claro; ThemeService toma el control después.
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('cb_theme'); } catch (e) {}
      if (mode !== 'dark' && mode !== 'light') {
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (mode === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
