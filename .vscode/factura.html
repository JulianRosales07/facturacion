<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SP · Facturación corporativa</title>

    <style>
        :root {
            --rojo: #e32636;
            --rojo-suave: #fff0f2;
            --fondo: #f5f6f8;
            --texto: #20232b;
            --gris: #737987;
            --borde: #e8eaf0;
            --verde: #15815d;
            --ambar: #a86a08;
            --azul: #3267b1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        button,
        input,
        select,
        textarea {
            outline-offset: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #ed8590;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 245px;
            background: #181a20;
            color: white;
            padding: 28px 17px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px 28px;
        }

        .logo b {
            background: var(--rojo);
            padding: 10px;
            border-radius: 12px;
            font-size: 23px;
        }

        .logo strong {
            font-size: 16px;
        }

        .logo small {
            display: block;
            color: #9398a5;
            margin-top: 4px;
        }

        .nav-label {
            font-size: 10px;
            letter-spacing: 1.8px;
            color: #8d93a0;
            padding: 18px 13px 9px;
        }

        nav button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: 0;
            background: none;
            color: #b8bec9;
            text-align: left;
            padding: 13px;
            border-radius: 9px;
            margin: 3px 0;
        }

        nav button span {
            width: 21px;
            font-size: 18px;
            text-align: center;
        }

        nav button.active {
            background: var(--rojo);
            color: white;
        }

        nav button:hover:not(.active) {
            background: #292c35;
            color: white;
        }

        .side-foot {
            margin-top: auto;
            padding: 18px 12px 0;
            border-top: 1px solid #34363e;
            color: #a6acb8;
            font-size: 11px;
            line-height: 1.8;
        }

        main {
            margin-left: 245px;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--borde);
            padding: 17px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .topbar strong {
            font-size: 13px;
        }

        .avatar {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            background: #f0f1f4;
            border-radius: 50%;
            font-weight: 700;
            margin-left: 12px;
        }

        .content {
            padding: 30px 32px;
            max-width: 1600px;
            margin: auto;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 27px;
            letter-spacing: -.8px;
            margin: 0 0 7px;
        }

        h2 {
            font-size: 17px;
            margin: 0;
        }

        h3 {
            font-size: 14px;
            margin: 0 0 15px;
        }

        p {
            line-height: 1.6;
        }

        .muted {
            color: var(--gris);
        }

        .small {
            font-size: 12px;
        }

        .kicker {
            font-size: 10px;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--rojo);
            margin-bottom: 8px;
        }

        .btn {
            border: 1px solid var(--borde);
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--texto);
            font-weight: 600;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f4f5f7;
        }

        .btn.primary {
            background: var(--rojo);
            border-color: var(--rojo);
            color: white;
        }

        .btn.primary:hover {
            background: #cb1e2e;
        }

        .btn.danger {
            background: var(--rojo-suave);
            color: var(--rojo);
            border-color: #ffd4da;
        }

        .btn.link {
            border: none;
            background: none;
            color: var(--rojo);
            padding: 6px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            align-items: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 17px;
            margin-bottom: 24px;
        }

        .card,
        .panel {
            background: white;
            border: 1px solid var(--borde);
            border-radius: 13px;
        }

        .card {
            padding: 21px;
        }

        .card .value {
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -.7px;
            margin: 14px 0 7px;
            overflow-wrap: anywhere;
        }

        .card .icon {
            float: right;
            background: #f5f5f8;
            padding: 6px 10px;
            border-radius: 8px;
            color: var(--rojo);
        }

        .panel {
            margin-bottom: 21px;
            overflow: hidden;
        }

        .panel-head {
            padding: 21px 23px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid var(--borde);
        }

        .panel-body {
            padding: 23px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 21px;
        }

        .notice {
            padding: 13px 17px;
            border: 1px solid #f1deb7;
            border-radius: 9px;
            background: #fffaf0;
            color: #84621c;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 12px;
        }

        .notice.info {
            background: #f0f5fc;
            border-color: #dbe6f5;
            color: #3a5d8b;
        }

        .notice.success {
            background: #edf8f1;
            border-color: #cee9d9;
            color: #216d4d;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .3px;
            white-space: nowrap;
            background: #f0f1f4;
            color: #626876;
        }

        .badge.green {
            background: #e9f7ef;
            color: var(--verde);
        }

        .badge.red {
            background: var(--rojo-suave);
            color: var(--rojo);
        }

        .badge.blue {
            background: #edf3fe;
            color: var(--azul);
        }

        .badge.amber {
            background: #fff5df;
            color: var(--ambar);
        }

        .filters {
            padding: 17px 23px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            border: 1px solid #dce0e7;
            border-radius: 7px;
            padding: 10px 12px;
            background: white;
            color: var(--texto);
            max-width: 100%;
        }

        input[type=search] {
            min-width: 260px;
            flex: 1;
        }

        .table-wrap {
            overflow: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
            text-align: left;
        }

        th {
            font-size: 10px;
            color: var(--gris);
            letter-spacing: .65px;
            background: #fafbfc;
            padding: 13px 22px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 22px;
            border-bottom: 1px solid #f0f1f4;
            font-size: 12px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fdfdfe;
        }

        td strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: var(--gris);
        }

        .wrap {
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .step {
            padding: 17px;
            border: 1px solid var(--borde);
            border-radius: 9px;
        }

        .step b {
            display: grid;
            place-items: center;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: var(--rojo-suave);
            color: var(--rojo);
            margin-bottom: 13px;
        }

        .step strong {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .bar-row {
            margin: 0 0 21px;
        }

        .bar-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            font-size: 12px;
        }

        .track {
            height: 8px;
            background: #f0f1f5;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: var(--rojo);
            border-radius: 10px;
        }

        dl {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 13px;
            margin: 0;
        }

        dt {
            color: var(--gris);
        }

        dd {
            margin: 0;
            text-align: right;
            font-weight: 600;
        }

        .total {
            padding-top: 15px;
            border-top: 1px solid var(--borde);
            font-size: 17px;
        }

        dialog {
            border: 0;
            border-radius: 15px;
            padding: 0;
            width: min(980px, 94vw);
            max-height: 90vh;
            box-shadow: 0 30px 100px #1114;
            color: var(--texto);
        }

        dialog::backdrop {
            background: #11182788;
            backdrop-filter: blur(3px);
        }

        .dialog-head {
            position: sticky;
            top: 0;
            background: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borde);
            z-index: 1;
        }

        .dialog-body {
            padding: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 12px;
            color: #596171;
        }

        label.full {
            grid-column: 1 / -1;
        }

        label input,
        label select {
            width: 100%;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 23px;
        }

        .error {
            color: #c32032;
            margin-top: 12px;
            font-size: 12px;
        }

        .separator {
            height: 1px;
            background: var(--borde);
            margin: 25px 0;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            max-width: 450px;
            background: #20252e;
            color: white;
            padding: 15px 22px;
            border-radius: 10px;
            z-index: 30;
            box-shadow: 0 6px 30px #0002;
        }

        .mobile-menu {
            display: none;
        }

        @media (max-width: 1100px) {
            .sidebar {
                width: 215px;
            }

            main {
                margin-left: 215px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 24px;
            }
        }

        @media (max-width: 720px) {
            .sidebar {
                transform: translateX(-100%);
                width: 245px;
            }

            .sidebar.open {
                transform: none;
                box-shadow: 0 0 0 100vmax #0006;
            }

            main {
                margin-left: 0;
            }

            .mobile-menu {
                display: inline-block;
            }

            .content {
                padding: 20px 15px;
            }

            .topbar {
                padding: 14px 15px;
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 23px;
            }

            .card {
                padding: 15px;
            }

            .card .value {
                font-size: 20px;
            }

            .steps {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .dialog-body {
                padding: 17px;
            }

            .topbar .muted {
                display: none;
            }

            td,
            th {
                padding: 13px;
            }

            .filters {
                padding: 15px;
            }

            input[type=search] {
                min-width: 100%;
                width: 100%;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 15px;
            }
        }

        @media (max-width: 420px) {

            .cards,
            .steps {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <b>SP</b>
            <div>
                <strong>Facturación</strong>
                <small>Sistemas Palacios</small>
            </div>
        </div>

        <nav id="nav" aria-label="Navegación principal"></nav>

        <div class="side-foot">
            corporate-billing-service<br>
            <span class="badge red">ENTORNO DEMO</span>
            <p id="storageLabel">Datos locales del navegador</p>
        </div>
    </aside>

    <main>
        <header class="topbar">
            <div class="actions">
                <button class="btn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')"
                    aria-label="Abrir o cerrar menú">☰</button>

                <strong>Operación corporativa</strong>
                <span class="muted">/ Facturación B2B</span>
            </div>

            <div>
                <span class="badge amber">DEMO · SIN CONEXIÓN</span>
                <span class="avatar">SP</span>
            </div>
        </header>

        <div class="content" id="app"></div>
    </main>

    <dialog id="modal" aria-labelledby="modalTitle">
        <div class="dialog-head">
            <h2 id="modalTitle"></h2>
            <button class="btn" onclick="cerrar()" aria-label="Cerrar">✕</button>
        </div>
        <div class="dialog-body" id="modalBody"></div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script>
        "use strict";

        /* ==========================================================
           UTILIDADES Y ESTADO
           ========================================================== */

        const $ = id => document.getElementById(id);

        const escapar = valor => String(valor ?? "").replace(
            /[&<>"']/g,
            caracter => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[caracter]
        );

        // Importes de demostración guardados como enteros en centavos.
        // El backend debe validar y calcular con BigDecimal.
        const dinero = centavos => new Intl.NumberFormat("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 2
        }).format(centavos / 100);

        const uid = () =>
            globalThis.crypto?.randomUUID?.() ||
            `${Date.now()}-${Math.random().toString(36).slice(2)}`;

        const CLAVE = "sp-corporate-billing-completo-v2";
        const PERIODO = "2026-08";

        let vista = "resumen";
        let consulta = "";
        let estadoFiltro = "";
        let temporizador;
        let previsualizacionActual = null;
        let almacenamientoDisponible = true;

        const menus = [
            ["resumen", "◫", "Resumen"],
            ["generar", "＋", "Generar factura"],
            ["facturas", "▤", "Facturas consolidadas"],
            ["clientes", "▦", "Clientes y sedes"],
            ["ordenes", "⇄", "Órdenes y novedades"],
            ["lotes", "↗", "Lotes Siigo"],
            ["ajustes", "↶", "Notas crédito"],
            ["tributaria", "％", "Configuración tributaria"]
        ];

        function inicial() {
            return {
                version: 2,

                clientes: [
                    {
                        id: "c1",
                        nit: "900000101",
                        nombre: "Corporativo Andino · Demo",
                        municipio: "Pasto",
                        direccion: "Dirección fiscal de demostración",
                        tipo: "F1",
                        marca: "Sistemas Palacios",
                        email: "facturacion@example.com"
                    },
                    {
                        id: "c2",
                        nit: "900000102",
                        nombre: "Red Comercial del Sur · Demo",
                        municipio: "Pasto",
                        direccion: "Dirección fiscal de demostración",
                        tipo: "F1",
                        marca: "Enlaces",
                        email: "cartera@example.com"
                    },
                    {
                        id: "c3",
                        nit: "900000103",
                        nombre: "Mayorista del Pacífico · Demo",
                        municipio: "Tumaco",
                        direccion: "Dirección fiscal de demostración",
                        tipo: "F20",
                        marca: "Meganet",
                        email: "administracion@example.com"
                    }
                ],

                sedes: [
                    {
                        id: "s1",
                        cliente: "c1",
                        nombre: "Sede principal",
                        orden: "SPE-1021",
                        nic: "—",
                        origen: "SPE",
                        mensual: 180000000,
                        certificacion: "2026-01-01",
                        instalacion: 0
                    },
                    {
                        id: "s2",
                        cliente: "c1",
                        nombre: "Sede norte",
                        orden: "SPE-1022",
                        nic: "—",
                        origen: "SPE",
                        mensual: 90000000,
                        certificacion: "2026-08-16",
                        instalacion: 10000000
                    },
                    {
                        id: "s3",
                        cliente: "c2",
                        nombre: "Centro administrativo",
                        orden: "ENL-0801",
                        nic: "—",
                        origen: "ENLACES",
                        mensual: 125000000,
                        certificacion: "2026-02-01",
                        instalacion: 0
                    },
                    {
                        id: "s4",
                        cliente: "c3",
                        nombre: "Nodo Tumaco",
                        orden: "MR-0201",
                        nic: "NIC-00892",
                        origen: "MEGA_RED",
                        mensual: 320000000,
                        certificacion: "2026-03-01",
                        instalacion: 0
                    }
                ],

                novedades: [
                    {
                        id: "n1",
                        sede: "s2",
                        tipo: "ALTA",
                        fecha: "2026-08-16",
                        observacion:
                            "Cobro desde certificación. Prorrateo por días calendario."
                    }
                ],

                vigencias: [],
                facturas: [],
                lotes: [],
                ajustes: []
            };
        }

        let datos;

        try {
            const almacenados = localStorage.getItem(CLAVE);
            datos = almacenados ? JSON.parse(almacenados) : inicial();

            if (
                datos.version !== 2 ||
                !["clientes", "sedes", "novedades", "vigencias", "facturas", "lotes", "ajustes"]
                    .every(nombre => Array.isArray(datos[nombre]))
            ) {
                datos = inicial();
            }
        } catch {
            datos = inicial();
            almacenamientoDisponible = false;
        }

        function guardar() {
            try {
                localStorage.setItem(CLAVE, JSON.stringify(datos));
                almacenamientoDisponible = true;
            } catch {
                almacenamientoDisponible = false;
                avisar("Los cambios quedan solo en esta sesión: el navegador no permitió guardarlos.");
            }

            actualizarAlmacenamiento();
        }

        function actualizarAlmacenamiento() {
            $("storageLabel").textContent = almacenamientoDisponible
                ? "Datos locales del navegador"
                : "Cambios solo en esta sesión";
        }

        function avisar(texto) {
            $("toast").textContent = texto;
            $("toast").hidden = false;
            clearTimeout(temporizador);
            temporizador = setTimeout(() => $("toast").hidden = true, 5000);
        }

        function abrir(titulo, contenido) {
            $("modalTitle").textContent = titulo;
            $("modalBody").innerHTML = contenido;
            if (!$("modal").open) $("modal").showModal();
        }

        function cerrar() {
            $("modal").close();
        }

        function etiqueta(estado) {
            const colores = {
                CONSOLIDADA: "green",
                ANULADA: "red",
                BORRADOR: "amber",
                GENERADO: "blue",
                CONFIRMADO: "green",
                ACTIVO: "green",
                ALTA: "blue"
            };

            return `<span class="badge ${colores[estado] || ""}">
    ${escapar(estado)}
  </span>`;
        }

        function tabla(cabeceras, filas) {
            return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${cabeceras.map(c => `<th>${c}</th>`).join("")}</tr>
        </thead>
        <tbody>
          ${filas.length ? filas.join("") : `
            <tr>
              <td colspan="${cabeceras.length}" class="empty">
                No hay registros para esta selección.
              </td>
            </tr>
          `}
        </tbody>
      </table>
    </div>
  `;
        }

        function cabecera(titulo, descripcion, accion = "") {
            return `
    <div class="heading">
      <div>
        <div class="kicker">SP / FACTURACIÓN CORPORATIVA</div>
        <h1>${titulo}</h1>
        <div class="muted">${descripcion}</div>
      </div>
      ${accion}
    </div>
  `;
        }

        function panel(titulo, contenido, accion = "") {
            return `
    <section class="panel">
      <div class="panel-head">
        <h2>${titulo}</h2>
        ${accion}
      </div>
      ${contenido}
    </section>
  `;
        }

        function tarjetas(elementos) {
            return `
    <div class="cards">
      ${elementos.map(([titulo, valor, descripcion, icono]) => `
        <div class="card">
          ${icono ? `<span class="icon">${icono}</span>` : ""}
          <span class="muted small">${titulo}</span>
          <div class="value">${valor}</div>

        /* ==========================================================
           CÁLCULO DEL ESCENARIO DE DEMOSTRACIÓN
           ========================================================== */

        function calcular(cliente) {
            const items = [];

            for (const sede of datos.sedes.filter(s => s.cliente === cliente.id)) {
                if (sede.certificacion > "2026-08-31") continue;

                const diaInicio = sede.certificacion.startsWith(PERIODO)
                    ? Number(sede.certificacion.slice(-2))
                    : 1;

                const dias = 32 - diaInicio;
                const base = Math.round(sede.mensual * dias / 31);
                const iva = Math.round(base * 19 / 100);

                items.push({
                    sedeId: sede.id,
                    sede: sede.nombre,
                    descripcion: dias < 31
                        ? `Servicio · prorrateo ${dias}/31 días`
                        : "Servicio mensual",
                    base,
                    iva
                });

                if (sede.instalacion) {
                    items.push({
                        sedeId: sede.id,
                        sede: sede.nombre,
                        descripcion: "Instalación · cuota del periodo",
                        base: sede.instalacion,
                        iva: Math.round(sede.instalacion * 19 / 100)
                    });
                }
            }

            const subtotal = items.reduce((total, item) => total + item.base, 0);
            const iva = items.reduce((total, item) => total + item.iva, 0);
            const total = subtotal + iva;

            const retenciones = datos.vigencias
                .filter(v =>
                    v.cliente === cliente.id &&
                    v.desde <= "2026-08-31" &&
                    (!v.hasta || v.hasta >= "2026-08-31") &&
                    (
                        !v.municipio ||
                        v.municipio.toLowerCase() === cliente.municipio.toLowerCase()
                    )
                )
                .map(v => {
                    const base = v.concepto === "RETEIVA" ? iva : subtotal;

                    return {
                        concepto: v.concepto,
                        porcentaje: v.porcentaje,
                        valor: base >= v.minima
                            ? Math.round(base * v.porcentaje / 100)
                            : 0
                    };
                });

            const retenido = retenciones.reduce((suma, r) => suma + r.valor, 0);

            return {
                items,
                subtotal,
                iva,
                total,
                retenciones,
                retenido,
                neto: total - retenido
            };
        }

                c.tipo === parametros.tipo &&
                (!parametros.cliente || c.id === parametros.cliente)
            );

            const disponibles = [];
            const omitidos = [];
            const errores = [];

            if (!seleccionados.length) {
                errores.push("El cliente seleccionado no corresponde al tipo de comprobante.");
            }

            for (const cliente of seleccionados) {
                const existente = datos.facturas.some(f =>
                    f.cliente === cliente.id &&
                    f.periodo === parametros.periodo &&
                    f.estado !== "ANULADA"
                );

                if (existente) {
                    omitidos.push(cliente.nombre);
                    continue;

                const calculo = calcular(cliente);

                if (!calculo.items.length) {
                    errores.push(`${cliente.nombre}: no tiene ítems facturables.`);
                    continue;
                }

                if (calculo.neto < 0) {
                    errores.push(`${cliente.nombre}: las retenciones superan el valor oficial.`);
                    continue;

                disponibles.push({ cliente, calculo });
            }

            return { disponibles, omitidos, errores };

        function crearNota(evento, id) {
            evento.preventDefault();

            const p = Object.fromEntries(new FormData(evento.target));
            const f = datos.facturas.find(f => f.id === id);
            if (!f || f.estado === "ANULADA") return;

            const indice = Number(p.item);
            const item = f.items[indice];
            const porcentaje = Number(p.porcentaje);
            const motivo = p.motivo.trim();

            if (!item || motivo.length < 5 || porcentaje <= 0 || porcentaje > 100) {
                avisar("Revisa el ítem, el porcentaje y el motivo.");
                return;
            }

            const anteriores = datos.ajustes.filter(a =>
                a.factura === id && a.item === indice
            );

            const usado = anteriores.reduce((suma, a) => suma + a.porcentaje, 0);

            if (Math.round((usado + porcentaje) * 100) > 10000) {
                avisar("Los borradores acumulados superan el 100% de este ítem.");
                return;
            }

            const baseAcumulada = Math.round(item.base * (usado + porcentaje) / 100);
            const ivaAcumulado = Math.round(item.iva * (usado + porcentaje) / 100);

            const base = baseAcumulada - anteriores.reduce((suma, a) => suma + a.base, 0);
            const iva = ivaAcumulado - anteriores.reduce((suma, a) => suma + a.iva, 0);

            datos.ajustes.push({
                id: uid(),
                factura: id,
                item: indice,
                porcentaje,
                cliente: f.nombre,
                motivo,
                base,
                iva,
                total: base + iva,
                estado: "BORRADOR"
            });

            guardar();
            navegar("ajustes");
            avisar("Nota crédito guardada como borrador.");
        }

        /* ==========================================================
           EXPORTACIÓN DE REVISIÓN — NO ES EL PLANO OFICIAL SIIGO
           ========================================================== */

        function csv(nombre, filas) {
            const celda = valor => {
                let texto = String(valor ?? "");

                // Neutraliza fórmulas en contenido de texto editable.
                if (/^\s*[=+\-@]/.test(texto) || /^[\t\r]/.test(texto)) {
                    texto = "'" + texto;
                }

                return '"' + texto.replace(/"/g, '""') + '"';
            };

            const contenido = "\uFEFF" + filas
                .map(fila => fila.map(celda).join(";"))
                .join("\r\n");

            const url = URL.createObjectURL(new Blob(
                [contenido],
                { type: "text/csv;charset=utf-8" }
            ));

            const enlace = document.createElement("a");
            enlace.href = url;
            enlace.download = nombre;
            document.body.append(enlace);
            enlace.click();
            enlace.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function filasRevision(ids) {
            const filas = [
                ["DEMO - REVISION CONTABLE - NO IMPORTAR EN SIIGO"],
                ["NIT", "Cliente", "Periodo", "Tipo", "Concepto", "Naturaleza", "Valor COP"]
            ];

            ids.forEach(id => {
                const f = datos.facturas.find(f => f.id === id);
                if (!f) return;

                f.items.forEach(item => {
                    filas.push([
                        f.nit,
                        f.nombre,
                        f.periodo,
                        f.tipo,
                        item.sede + " / " + item.descripcion,
                        "C",
                        (item.base / 100).toFixed(2)
                    ]);
                });

                filas.push([
                    f.nit, f.nombre, f.periodo, f.tipo,
                    "IVA", "C", (f.iva / 100).toFixed(2)
                ]);

                filas.push([
                    f.nit, f.nombre, f.periodo, f.tipo,
                    "CARTERA", "D", (f.total / 100).toFixed(2)
                ]);
            });

            return filas;
        }

        function descargarFactura(id) {
            const f = datos.facturas.find(f => f.id === id);
            if (!f) return;

            csv(
                `revision-factura-${f.nit}-${f.periodo}-demo.csv`,
                filasRevision([id])
            );
        }

        function exportarLote(id) {
            const lote = datos.lotes.find(l => l.id === id);
            if (!lote) return;

            csv(
                `revision-lote-${lote.tipo}-${lote.periodo}-demo.csv`,
                filasRevision(lote.facturas)
            );
        }

        /* ==========================================================
           INICIO
           ========================================================== */

        render();
    </script>
</body>

</html>
